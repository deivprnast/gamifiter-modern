name: Build Android APK (Gamifiter)

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Generate FTK Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/gamifiter-release.keystore \
            -alias gamifiter \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ftkupol2026 \
            -keypass ftkupol2026 \
            -dname "CN=Gamifiter Telemetry, OU=FTK, O=Univerzita Palackeho v Olomouci, L=Olomouc, C=CZ"

      - name: Build Signed Android Release APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Artifacts
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Gamifiter.apk
          cp Gamifiter.apk Gamifiter-Release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gamifiter-APK
          path: Gamifiter.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Gamifiter.apk
            Gamifiter-Release.apk
          name: Gamifiter ${{ github.ref_name }}
          body: |
            ## 📱 Gamifiter Android APK (${{ github.ref_name }})
            - Podepsaný instalační balíček pro Android telefony (Release build).
            - Podpora Google Health Connect a senzorů.
            - Výzkumná telemetrie FTK UP.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
